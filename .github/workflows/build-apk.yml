name: Compiler HTML en APK Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le dossier web
        run: |
          mkdir www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' ./ www/
      - name: Créer le projet Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MonApp" com.monapp.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: application-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
